<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vogi HSE Inspector</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="hse-shell">
      <section class="hse-card">
        <header class="topbar compact-topbar">
          <div>
            <div class="eyebrow">Vision Safety Check</div>
            <h1>HSE Image Inspector</h1>
          </div>
          <a class="ghost-button" href="/agent">Open Agent</a>
        </header>
        <form id="inspectionForm" class="inspection-form">
          <label class="dropzone" for="imageInput">
            <input id="imageInput" name="images" type="file" accept="image/*" multiple />
            <strong>Select safety site images</strong>
            <span>PNG, JPG, or WebP. Up to 6 images.</span>
          </label>
          <div id="previewGrid" class="preview-grid"></div>
          <div class="button-row">
            <button id="inspectButton" class="primary-action compact" type="submit">Run Inspection</button>
            <button id="clearButton" class="ghost-button" type="button">Clear</button>
          </div>
        </form>
      </section>
      <aside class="result-panel">
        <h2>Inspection Result</h2>
        <span id="resultBadge" class="status-pill">Idle</span>
        <div id="summaryCards" class="summary-grid">
          <div><span>Status</span><strong>-</strong></div>
          <div><span>Severity</span><strong>-</strong></div>
          <div><span>Critical</span><strong>-</strong></div>
        </div>
        <h3>Violations</h3>
        <ul id="violationsList"></ul>
        <h3>Observations</h3>
        <p id="observationsText">Upload images and run an inspection.</p>
        <h3>Corrective Actions</h3>
        <ul id="actionsList"></ul>
        <pre id="rawJson">{}</pre>
      </aside>
    </main>
    <script src="/assets/hse.js" type="module"></script>
  </body>
</html>
